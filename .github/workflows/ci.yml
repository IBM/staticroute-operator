name: CI

on:
  push:
    branches-ignore:
      - "build-*"
      - "v*.*.*"
    tags-ignore:
      - "build-*"
      - "v*.*.*"
  pull_request:
    branches-ignore:
      - "build-*"
      - "v*.*.*"

jobs:
  fvt:
    name: FVT
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.5"

      - name: Install yamllint
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip --quiet install yamllint

      - name: Set Docker registry variables
        run: |
          REGISTRY_URL="$(echo "${DOCKER_REGISTRY_LIST}" | tr ',' ' ' | cut -d' ' -f1)"
          echo "REGISTRY_URL=${REGISTRY_URL}" >> "${GITHUB_ENV}"
          echo "REGISTRY_REPO=${REGISTRY_URL}/${DOCKER_IMAGE_NAME}" >> "${GITHUB_ENV}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/s390x

      - name: Show Docker versions
        run: |
          docker --version
          docker buildx version

      - name: Run FVT
        run: |
          make deps INSTALL_LOCATION="${{ github.workspace }}/bin"
          make fvt

      - name: Deploy and tag on release branches
        if: github.event_name == 'push' && startsWith(github.ref_name, 'release-')
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GH_TOKEN != '' && secrets.GH_TOKEN || github.token }}
          GITHUB_BRANCH: ${{ github.ref_name }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: bash scripts/github-provider-script.sh
